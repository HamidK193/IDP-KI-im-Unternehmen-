<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0e1513;
    color: #e9eeea;
    font-family: "Bricolage Grotesque", sans-serif;
    display: grid;
    place-items: center;
    position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(233,238,234,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,238,234,.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 30%, transparent 75%);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(67,212,155,.14), transparent 65%);
    top: -300px; right: -200px; filter: blur(40px);
    animation: drift 10s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(-80px, 60px) scale(1.15); } }
  .wrap { text-align: center; position: relative; max-width: 1500px; padding: 0 80px; }
  .badge {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace; font-size: 26px; color: #b3bfb8;
    border: 1px solid rgba(233,238,234,.18); border-radius: 999px;
    padding: 16px 32px; background: rgba(21,32,28,.8);
    opacity: 0; animation: up .8s .3s cubic-bezier(.22,1,.36,1) forwards;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #43d49b;
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(67,212,155,.15); } }
  h1 {
    font-size: 110px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;
    margin: 48px 0 36px;
    opacity: 0; animation: up .9s .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  h1 em { font-style: normal; color: #43d49b; border-bottom: 8px solid rgba(67,212,155,.35); }
  .sub {
    font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: .18em;
    text-transform: uppercase; color: #93a09a;
    opacity: 0; animation: up .9s 1.6s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .spark {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 340px; opacity: .55;
  }
  .spark polyline {
    fill: none; stroke: #43d49b; stroke-width: 5; stroke-linejoin: round;
    stroke-dasharray: 4000; stroke-dashoffset: 4000;
    animation: draw 4s 1.2s ease-out forwards;
  }
  .spark polyline.l2 { stroke: #6fa8e8; opacity: .5; animation-delay: 2s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <svg class="spark" viewBox="0 0 1920 340" preserveAspectRatio="none">
    <polyline points="0,260 240,230 480,245 720,185 960,200 1200,130 1440,150 1680,80 1920,95"/>
    <polyline class="l2" points="0,300 240,290 480,260 720,272 960,235 1200,245 1440,205 1680,215 1920,180"/>
  </svg>
  <div class="wrap">
    <span class="badge"><span class="dot"></span> Diese Website &amp; dieses Video wurden mit KI gebaut</span>
    <h1>KI macht die Zahlen kleiner Unternehmen <em>lesbar</em>.</h1>
    <p class="sub">IDP · Hochschule Pforzheim · KI-Controlling-Cockpit</p>
  </div>
</body>
</html>
