<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0e1513; color: #e9eeea;
    font-family: "Bricolage Grotesque", sans-serif;
    display: grid; place-items: center; position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(233,238,234,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,238,234,.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 78%);
  }
  .glow {
    position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
    background: radial-gradient(circle, rgba(67,212,155,.13), transparent 65%);
    bottom: -400px; left: -250px; filter: blur(40px);
  }
  .wrap {
    position: relative; display: grid; grid-template-columns: 1fr auto;
    gap: 110px; align-items: center; max-width: 1560px; padding: 0 80px;
  }
  .brand {
    display: flex; align-items: center; gap: 22px;
    opacity: 0; animation: up .8s .2s cubic-bezier(.22,1,.36,1) forwards;
  }
  .brand svg { width: 64px; height: 64px; }
  .brand b { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
  .brand b span { color: #43d49b; font-weight: 600; }
  h1 {
    font-size: 88px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em;
    margin: 36px 0 30px;
    opacity: 0; animation: up .9s .6s cubic-bezier(.22,1,.36,1) forwards;
  }
  h1 em { font-style: normal; color: #43d49b; }
  .facts {
    font-family: "JetBrains Mono", monospace; font-size: 28px; line-height: 2;
    color: #b3bfb8;
    opacity: 0; animation: up .9s 1.1s cubic-bezier(.22,1,.36,1) forwards;
  }
  .facts b { color: #e9eeea; font-weight: 700; }
  .url {
    display: inline-block; margin-top: 30px;
    font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 700;
    color: #06241a; background: #43d49b; border-radius: 999px; padding: 18px 38px;
    opacity: 0; animation: up .9s 1.6s cubic-bezier(.22,1,.36,1) forwards;
  }
  .qr {
    background: #fff; border-radius: 28px; padding: 34px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
    opacity: 0; animation: up 1s 1.4s cubic-bezier(.22,1,.36,1) forwards;
    text-align: center;
  }
  .qr img { width: 380px; height: 380px; display: block; }
  .qr span {
    display: block; margin-top: 18px; font-family: "JetBrains Mono", monospace;
    font-size: 24px; color: #1c2320; font-weight: 700;
  }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div>
      <div class="brand">
        <svg viewBox="0 0 32 32"><rect x="2" y="18" width="6" height="12" rx="1.5" fill="#e9eeea"/><rect x="13" y="10" width="6" height="20" rx="1.5" fill="#e9eeea"/><rect x="24" y="2" width="6" height="28" rx="1.5" fill="#43d49b"/></svg>
        <b>Kara<span>·Cockpit</span></b>
      </div>
      <h1>Jetzt <em>live</em> ausprobieren.</h1>
      <p class="facts">
        <b>Hochschule Pforzheim</b> · Interdisziplinäres Projekt (IDP)<br>
        Abdulhamid Karatas &amp; Kadir Atar<br>
        Website, Demo &amp; Video: <b>mit KI (Claude) gebaut</b>
      </p>
      <span class="url">hamidk193.github.io/IDP-KI-im-Unternehmen-</span>
    </div>
    <div class="qr">
      <img src="../../website/assets/qr-live.svg" alt="QR-Code zur Live-Demo">
      <span>Scannen &amp; ausprobieren</span>
    </div>
  </div>
</body>
</html>
